version: "3.9"

services:
  web:
    build: .
    container_name: banking-app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=staging
      - APP_VERSION=1.0.0
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: banking-db
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dbdata:
